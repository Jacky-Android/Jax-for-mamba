[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-for-mamba"
version = "0.1.0"
description = "Educational Mamba-1 reference in JAX and Flax"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "flax>=0.8.4", "numpy>=1.24"]

[project.optional-dependencies]
train = ["optax>=0.2.2"]
dev = ["pytest>=8", "optax>=0.2.2"]

[tool.setuptools.packages.find]
include = ["jax_mamba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
